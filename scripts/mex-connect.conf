# NGINX config para mex-connect SPA em /connect
server {
    listen 443 ssl;
    server_name mex.app.br;

    ssl_certificate /etc/letsencrypt/live/mex.app.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mex.app.br/privkey.pem;

    location ^~ /connect/ {
        alias /home/ubuntu/mex-connect/;
        index connect.html;
        try_files $uri $uri/ /connect.html;
        add_header Cache-Control "no-cache";
    }
    location = /connect {
        return 301 /connect/;
    }

    # Serve /connect.html diretamente
    location = /connect.html {
        alias /home/ubuntu/mex-connect/connect.html;
    }
    # (SSL config e outros blocos podem ser incluídos no arquivo principal)
}
